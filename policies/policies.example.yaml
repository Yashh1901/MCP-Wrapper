# ============================================================
#  policies.example.yaml — Access Control Policies
#
#  Copy this file to policies.yaml to set up your access policies.
#  Policies are applied PER CONNECTION and control what
#  the LLM/AI tools can see and query.
#
#  Policy evaluation order:
#    1. Connection-level defaults
#    2. Table-level rules
#    3. Column-level masking
#    4. Query-level limits
# ============================================================

# ---- Global Defaults (applied to all connections unless overridden) ----
defaults:
  allow_schema_introspection: true    # Allow LLMs to see table/column names
  allow_query_execution: true         # Allow SELECT queries
  max_rows_per_query: 100             # Max rows an LLM can retrieve at once
  allow_sample_data: true             # Allow get_sample_data tool
  sample_data_max_rows: 5            # Max rows for sample data

# ================================================================
# Per-connection policies
# ================================================================
policies:

  # ---- PostgreSQL Policy ----
  my_postgres:
    description: "Main production DB — restricted LLM access"

    # Schema access
    allow_schema_introspection: true

    # Query execution
    allow_query_execution: true
    max_rows_per_query: 50

    # Table-level access control
    tables:
      # Only these tables are visible and queryable (allowlist)
      # Comment out 'allow' to use 'deny' blocklist mode instead
      allow:
        - users
        - products
        - orders
        - categories
        - order_items

      # Alternatively, block specific tables (blocklist mode):
      # deny:
      #   - audit_logs
      #   - payment_details
      #   - admin_configs

    # Column-level masking — sensitive data is replaced with '***'
    column_masks:
      users:
        - password_hash
        - ssn
        - credit_card
        - phone_number
        - email         # mask email in LLM output
      payment_details:
        - card_number
        - cvv
        - expiry

    # Sample data — can have tighter row limits
    allow_sample_data: true
    sample_data_max_rows: 3

  # ---- MySQL Policy ----
  my_mysql:
    description: "Legacy DB — read everything except secrets"
    allow_schema_introspection: true
    allow_query_execution: true
    max_rows_per_query: 100

    tables:
      deny:
        - user_tokens
        - api_keys
        - sessions

    column_masks:
      users:
        - password
        - secret_question_answer

  # ---- MongoDB Policy ----
  my_mongo:
    description: "Document store — allow all collections except logs"
    allow_schema_introspection: true
    allow_query_execution: true
    max_rows_per_query: 50

    # For MongoDB, 'tables' maps to 'collections'
    collections:
      deny:
        - system_logs
        - audit_trail
        - raw_events

    field_masks:
      users:
        - password_hash
        - auth_tokens

  # ---- SQLite Policy ----
  my_sqlite:
    description: "Local dev DB — full access"
    allow_schema_introspection: true
    allow_query_execution: true
    max_rows_per_query: 200
    allow_sample_data: true
    sample_data_max_rows: 10

  # ---- Redis Policy ----
  my_redis:
    description: "Redis — only key pattern introspection, no value read"
    allow_schema_introspection: true    # lists key patterns/namespaces
    allow_query_execution: false        # no direct key reads
    allow_sample_data: false

  # ---- MSSQL Policy ----
  my_mssql:
    description: "MSSQL — schema only, no query execution"
    allow_schema_introspection: true
    allow_query_execution: false
    allow_sample_data: false

  # ---- Supabase Policy ----
  my_supabase:
    description: "Supabase — allow reading public schema only"
    allow_schema_introspection: true
    allow_query_execution: true
    max_rows_per_query: 50

    tables:
      # Only expose public schema tables
      allow:
        - profiles
        - posts
        - comments
        - tags

    column_masks:
      profiles:
        - auth_id
        - private_email
