[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-db-wrapper"
version = "0.1.0"
description = "Universal MCP Database Wrapper — connect any database to any LLM/GenAI tool securely"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MCP DB Wrapper Contributors" }]
keywords = ["mcp", "llm", "database", "ai", "wrapper", "genai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # MCP
    "mcp>=1.0.0",

    # HTTP transport
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",

    # SQL query validation / parsing
    "sqlglot>=23.0.0",

    # Database drivers
    "asyncpg>=0.29.0",           # PostgreSQL (async)
    "psycopg2-binary>=2.9.9",    # PostgreSQL (sync fallback)
    "aiomysql>=0.2.0",           # MySQL (async)
    "PyMySQL>=1.1.0",            # MySQL (sync fallback)
    "motor>=3.4.0",              # MongoDB (async)
    "pymongo>=4.7.0",            # MongoDB (sync)
    "aiosqlite>=0.20.0",         # SQLite (async)
    "redis[hiredis]>=5.0.0",     # Redis
    "aioodbc>=0.5.0",            # MSSQL (async via ODBC)
    "pyodbc>=5.1.0",             # MSSQL (sync)
    "supabase>=2.4.0",           # Supabase

    # Config / Security / Utils
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "rich>=13.7.0",              # Beautiful CLI output
    "typer>=0.12.0",             # CLI
    "structlog>=24.2.0",         # Structured logging
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
mcp-db-wrapper = "mcp_db_wrapper.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_db_wrapper*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
